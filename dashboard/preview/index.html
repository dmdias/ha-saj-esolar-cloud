<!doctype html>
<!--
  Standalone preview of saj-elekeeper-card with a mocked Home Assistant
  (states, entity registry, history and statistics), using values from the
  Elekeeper portal screenshots. Open in a browser:
    preview/index.html?tab=overview   (overview | device | analysis | comparison)
    &mode=day                         (day | week | month | year | total, for analysis)
    &width=1500
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>SAJ Elekeeper card preview</title>
  <style>
    body { margin: 0; background: #05070c; padding: 20px; }
    #host { margin: auto; }
  </style>
</head>
<body>
  <div id="host"></div>
  <script src="../saj-elekeeper-card.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const PLANT = "87QA3F";
    const INV = "H1X2602J2612E00742";
    const BATS = ["B2U2220J2508E00285", "B2U2220J2508E00145", "B2U2220J2516E01765"];
    const now = new Date(2026, 9, 12, 13, 35, 55);

    const plantStates = {
      nowPower: 2774, pvPower: 2774, todayElectricity: 6.98, monthElectricity: 193.04, yearElectricity: 5849.97,
      totalElectricity: 8403.17, totalConsumpElec: 9086.05, totalBuyElec: 2193.85, totalSellElec: 1411.42,
      selfUseRate: 91.69, dailyConsumption: 6.05, dailyGridImport: 0.17, dailyGridExport: 0.58,
      dailyBatteryCharge: 4.26, dailyBatteryDischarge: 3.74, gridPower: 0, gridPowerAbsolute: 0,
      batteryPower: -2160, batteryPowerAbsolute: 2160, totalLoadPower: 613, outPower: 613,
      batCurr: 41, batEnergyPercent: 39, batCapcity: 15.36, usableBatCapacity: 14.6, batVoltage: 53.3,
      operatingMode: "Self-use mode", batteryDirection: "Charging", isOnline: "Yes", inverterStatus: "OK",
      lastUploadTime: new Date(2026, 9, 12, 13, 35, 55).toISOString(),
      inverterTemperature: 47.1, batteryCellTempMax: 26, batteryCellTempMin: 25, batteryCellVoltMax: 3332,
      batteryCellVoltMin: 3301, batteryRemainingEnergy: 5.99, batteryTimeToFull: 4.34, selfSufficiencyRate: 97.2,
      totalBatteryCharge: 358.87, totalBatteryDischarge: 322.71, totalRevenue: 102.7, yesterdayRevenue: 2.8,
    };
    const batteryStates = (i) => ({ batSoc: 39, batTemperature: 25 + i * 0.5, batSoh: 99, runningState: "Running", batModel: "B2-5.0-LV2" });

    const registry = [];
    const states = {};
    const add = (uid, key, value, attrs = {}) => {
      const entity_id = `sensor.${uid.toLowerCase()}`;
      registry.push({ entity_id, platform: "saj_esolar_cloud", unique_id: `saj_esolar_cloud_${uid}`, device_id: uid.includes("B2U") ? "bat" : "plant" });
      states[entity_id] = { entity_id, state: String(value), attributes: attrs, last_updated: now.toISOString() };
      return entity_id;
    };
    for (const [k, v] of Object.entries(plantStates)) {
      const attrs = k === "inverterStatus" ? { serial_number: INV, model: "H1-6K-S2-15" } : k === "totalRevenue" ? { unit_of_measurement: "EUR" } : {};
      add(`${PLANT}_${k}`, k, v, attrs);
    }
    BATS.forEach((sn, i) => {
      for (const [k, v] of Object.entries(batteryStates(i))) add(`${PLANT}_${sn}_${k}`, k, v, k === "batModel" ? { serial_number: sn } : {});
    });
    // ?norevenue=1 mimics accounts whose API reports no revenue
    if (params.get("norevenue")) for (const k of ["totalRevenue", "yesterdayRevenue"]) states[`sensor.${PLANT.toLowerCase()}_${k.toLowerCase()}`].state = "unknown";
    const idOf = (key) => `sensor.${PLANT.toLowerCase()}_${key.toLowerCase()}`;

    // Day curves shaped like the portal screenshot
    function dayHistory(key) {
      const start = new Date(2026, 9, 12).getTime();
      const pts = [];
      for (let m = 0; m <= 13 * 60 + 35; m += 5) {
        const h = m / 60;
        const sun = Math.max(0, Math.sin(((h - 7) / 12) * Math.PI));
        const load = 400 + 80 * Math.sin(m / 37) + (Math.abs(h - 8.2) < 0.1 ? 2100 : 0) + (h > 9 ? 150 : 0);
        const pv = 2900 * sun * sun + 30;
        let v;
        if (key === "pvPower") v = pv;
        else if (key === "totalLoadPower") v = load;
        else if (key === "gridPower") v = Math.abs(h - 9.6) < 0.25 ? 250 : 0;
        else if (key === "batteryPower") v = h < 9.8 ? load - pv : -(pv - load) * 1.1;
        else v = h < 9.6 ? 40 - h * 2.6 : 15 + (h - 9.6) * 6.3;
        pts.push({ s: v.toFixed(1), lu: (start + m * 60000) / 1000 });
      }
      return pts;
    }

    // Long-term statistics ("change" per period), shaped like the bar charts
    const dailyProfile = { totalElectricity: 15, totalConsumpElec: 13, totalBuyElec: 2, totalSellElec: 2.5, totalBatteryCharge: 8.5, totalBatteryDischarge: 7.5 };
    const monthlyPv2026 = [205, 298, 573, 680, 818, 850, 873, 731, 638, 193];
    const monthlyPv2025 = [null, null, null, null, null, null, 428, 585, 566, 442, 300, 238];
    const ratio = { totalElectricity: 1, totalConsumpElec: 1.04, totalBuyElec: 0.2, totalSellElec: 0.17, totalBatteryCharge: 0.37, totalBatteryDischarge: 0.35 };
    function statistics(msg) {
      const out = {};
      const start = new Date(msg.start_time);
      const end = new Date(msg.end_time);
      for (const id of msg.statistic_ids) {
        const key = Object.keys(dailyProfile).find((k) => idOf(k) === id);
        const rows = [];
        if (msg.period === "day") {
          for (let d = new Date(start); d < end && d <= now; d.setDate(d.getDate() + 1)) {
            const wobble = 0.55 + 0.45 * Math.abs(Math.sin(d.getDate() * 1.7 + key.length));
            rows.push({ start: d.getTime(), change: +(dailyProfile[key] * wobble).toFixed(2) });
          }
        } else {
          for (let d = new Date(start); d < end && d <= now; d.setMonth(d.getMonth() + 1)) {
            const pv = d.getFullYear() === 2026 ? monthlyPv2026[d.getMonth()] : d.getFullYear() === 2025 ? monthlyPv2025[d.getMonth()] : null;
            if (pv !== null && pv !== undefined) rows.push({ start: d.getTime(), change: +(pv * ratio[key]).toFixed(2) });
          }
        }
        out[id] = rows;
      }
      return out;
    }

    const hass = {
      states,
      devices: { plant: { name: "Daniel Matos Dias" } },
      callWS: async (msg) => {
        if (msg.type === "config/entity_registry/list") return registry;
        if (msg.type === "history/history_during_period") {
          const out = {};
          for (const id of msg.entity_ids) {
            const key = Object.keys(plantStates).find((k) => idOf(k) === id);
            out[id] = dayHistory(key);
          }
          return out;
        }
        if (msg.type === "recorder/statistics_during_period") return statistics(msg);
        throw new Error(`unexpected ${msg.type}`);
      },
    };

    // Freeze "today" to the screenshot date so the date controls match
    const RealDate = Date;
    window.Date = class extends RealDate {
      constructor(...a) { super(...(a.length ? a : [now.getTime()])); }
      static now() { return now.getTime(); }
    };

    const host = document.getElementById("host");
    host.style.width = `${params.get("width") || 1500}px`;
    const card = document.createElement("saj-elekeeper-card");
    card.setConfig({ view: "all", pv_capacity: 4.5 });
    host.appendChild(card);
    card.hass = hass;
    card._tab = params.get("tab") || "overview";
    if (params.get("mode")) card._analysis = { mode: params.get("mode"), date: new Date(2026, 9, 12) };
    if (params.get("detail")) card._detail = params.get("detail");
    if (params.get("cmode")) card._comparison.mode = params.get("cmode");
    setTimeout(() => card._render(), 50);
  </script>
</body>
</html>
