# Elekeeper-style dashboard for the SAJ eSolar Cloud integration.
#
# Settings > Dashboards > Add dashboard > "New dashboard from scratch",
# open it, ⋮ > Edit dashboard > ⋮ > Raw configuration editor, and paste this.
views:
  - title: Elekeeper
    path: elekeeper
    icon: mdi:solar-power-variant
    type: panel
    cards:
      - type: custom:saj-elekeeper-card
        view: all
        pv_capacity: 4.5
        # weather: weather.forecast_home
